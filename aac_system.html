<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#3B7DD8">
<title>我的溝通板 — AAC 輔助溝通系統</title>
<style>
/* ═══════════════════════════════════════════════
   AAC 溝通板 v4 — 完整獨立網頁版
   支援：相片上傳、自訂圖卡、分類管理、備份還原
   ═══════════════════════════════════════════════ */

@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700;900&display=swap');

:root {
  --blue:    #3B7DD8;
  --blue-dk: #1A56A8;
  --blue-lt: #EBF3FD;
  --green:   #27AE60;
  --green-dk:#1E8449;
  --red:     #E74C3C;
  --red-dk:  #C0392B;
  --amber:   #F59E0B;
  --bg:      #FFF9F2;
  --surface: #FFFFFF;
  --border:  #E4E0D8;
  --text:    #1E1D1A;
  --muted:   #8A8880;
  --radius:  14px;
  --shadow:  0 2px 12px rgba(0,0,0,0.08);

  /* 自適應間距 */
  --gap:     clamp(6px, 1.5vw, 12px);
  --pad:     clamp(8px, 2vw, 16px);
  --card-min: clamp(90px, 18vw, 130px);

  /* 圖卡視覺大小 */
  --visual-size: clamp(52px, 10vw, 72px);
  --emoji-size:  clamp(32px, 7vw, 46px);
  --label-size:  clamp(11px, 2vw, 14px);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { height: 100%; }

body {
  font-family: 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100%;
  font-size: clamp(13px, 1.8vw, 16px);
  -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
}

/* ══════════════════════════════════════════
   桌機雙欄佈局骨架
══════════════════════════════════════════ */
.app-layout {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

/* 桌機：左側邊欄 + 右主區 */
@media (min-width: 960px) {
  .app-layout { flex-direction: row; align-items: stretch; }

  .sidebar {
    width: clamp(240px, 22vw, 300px);
    flex-shrink: 0;
    background: var(--surface);
    border-right: 2px solid var(--border);
    display: flex;
    flex-direction: column;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
    box-shadow: 2px 0 12px rgba(0,0,0,0.06);
  }

  .main-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    overflow-y: auto;
    height: 100vh;
  }
}

/* 手機 / 平板：保持堆疊 */
@media (max-width: 959px) {
  .sidebar { display: contents; }
  .main-area { flex: 1; display: flex; flex-direction: column; }
}

/* 側邊欄頂部品牌區（桌機） */
.sidebar-brand {
  background: var(--blue);
  padding: 18px 16px 14px;
  display: none;
  flex-direction: column;
  gap: 4px;
}
@media (min-width: 960px) { .sidebar-brand { display: flex; } }
.sidebar-brand-title { color: white; font-size: 18px; font-weight: 900; letter-spacing: 0.5px; }
.sidebar-brand-sub   { color: rgba(255,255,255,0.7); font-size: 11px; font-weight: 600; }

/* 側邊欄控制區 */
.sidebar-controls {
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  border-bottom: 2px solid var(--border);
}
@media (max-width: 959px) { .sidebar-controls { display: none; } }

.ctrl-group { display: flex; flex-direction: column; gap: 4px; }
.ctrl-label { font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.6px; }

.ctrl-btn-full {
  width: 100%;
  padding: 9px 12px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
  border: 2px solid var(--border);
  background: var(--bg);
  color: var(--text);
  text-align: left;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: background 0.15s, border-color 0.15s;
}
.ctrl-btn-full:hover { background: var(--blue-lt); border-color: var(--blue); color: var(--blue-dk); }
.ctrl-btn-full.active { background: #FEF3C7; border-color: #FCD34D; color: #92400E; }
.ctrl-btn-full.cloud  { background: var(--blue); color: white; border-color: var(--blue); }
.ctrl-btn-full.cloud:hover { background: var(--blue-dk); }

.vol-row { display: flex; align-items: center; gap: 8px; }
.vol-row span { font-size: 16px; }
.vol-row input { flex: 1; accent-color: var(--blue); }

/* 側邊欄分類列表（桌機改為垂直列表） */
.sidebar-cats { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 4px; }
@media (max-width: 959px) { .sidebar-cats { display: none; } }

.sidebar-cat-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-radius: 10px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 700;
  color: var(--muted);
  transition: background 0.15s, color 0.15s;
  border: 2px solid transparent;
  user-select: none;
}
.sidebar-cat-item:hover { background: var(--blue-lt); color: var(--blue-dk); }
.sidebar-cat-item.active { background: var(--blue-lt); color: var(--blue-dk); border-color: #C8DFFA; }
.sidebar-cat-icon { font-size: 22px; flex-shrink: 0; }
.sidebar-cat-count { margin-left: auto; font-size: 11px; font-weight: 700; background: var(--border); border-radius: 10px; padding: 1px 7px; color: var(--muted); }
.sidebar-cat-item.active .sidebar-cat-count { background: #C8DFFA; color: var(--blue-dk); }

/* ── 頂部列（手機/平板顯示，桌機隱藏） ── */
.top-bar {
  background: var(--blue);
  padding: 10px var(--pad);
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  box-shadow: 0 2px 10px rgba(27,71,150,0.35);
  position: sticky;
  top: 0;
  z-index: 100;
}
@media (min-width: 960px) { .top-bar { display: none; } }

.app-title {
  color: white;
  font-size: clamp(15px, 3vw, 18px);
  font-weight: 900;
  letter-spacing: 0.5px;
  flex: 1;
  white-space: nowrap;
}

.top-right {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}

.tbtn {
  background: rgba(255,255,255,0.18);
  border: none;
  border-radius: 9px;
  color: white;
  font-size: clamp(11px, 2vw, 13px);
  font-weight: 700;
  padding: 7px 11px;
  cursor: pointer;
  white-space: nowrap;
  font-family: inherit;
  transition: background 0.15s;
}
.tbtn:hover { background: rgba(255,255,255,0.32); }
.tbtn.done { background: var(--amber); color: #6B3A00; }
.tbtn.cloud-btn-top { background: rgba(255,255,255,0.88); color: var(--blue-dk); }
.tbtn.cloud-btn-top:hover { background: white; }

.vol-wrap { display: flex; align-items: center; gap: 5px; }
.vol-wrap span { font-size: 15px; }
input[type=range] { width: 60px; accent-color: white; }

/* ── 句子列 ── */
.sentence-bar {
  background: var(--surface);
  border-bottom: 3px solid var(--blue);
  padding: clamp(7px,1.5vw,10px) var(--pad);
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: clamp(60px, 10vh, 80px);
  flex-wrap: wrap;
}

.s-label {
  font-size: 11px;
  color: var(--muted);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.6px;
  white-space: nowrap;
}

.s-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  flex: 1;
  align-items: center;
  min-width: 80px;
}

.chip {
  background: var(--blue-lt);
  border: 2px solid var(--blue);
  border-radius: 22px;
  padding: 5px 12px;
  font-size: 14px;
  font-weight: 700;
  color: var(--blue-dk);
  display: flex;
  align-items: center;
  gap: 5px;
  cursor: pointer;
  transition: background 0.1s, transform 0.1s;
  font-family: inherit;
}
.chip:hover { background: #D4E9FB; transform: scale(0.97); }
.chip-photo { width: 22px; height: 22px; border-radius: 50%; object-fit: cover; }

.s-actions { display: flex; gap: 6px; margin-left: auto; }

.speak-btn {
  background: var(--green);
  color: white;
  border: none;
  border-radius: var(--radius);
  padding: clamp(8px,1.5vw,11px) clamp(12px,2.5vw,18px);
  font-size: clamp(13px, 2vw, 16px);
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
  transition: background 0.15s, transform 0.1s;
  box-shadow: 0 2px 8px rgba(39,174,96,0.35);
  white-space: nowrap;
}
.speak-btn:hover { background: var(--green-dk); }
.speak-btn:active { transform: scale(0.96); }

.clear-btn {
  background: var(--red);
  color: white;
  border: none;
  border-radius: var(--radius);
  padding: clamp(8px,1.5vw,11px) clamp(10px,2vw,14px);
  font-size: clamp(13px, 2vw, 16px);
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
  transition: background 0.15s;
}
.clear-btn:hover { background: var(--red-dk); }

/* ── 情緒列 ── */
.emotion-bar {
  display: flex;
  gap: 5px;
  padding: 7px var(--pad);
  background: var(--surface);
  border-bottom: 2px solid var(--border);
  overflow-x: auto;
  scrollbar-width: none;
  align-items: center;
}
.emotion-bar::-webkit-scrollbar { display: none; }
.e-label { font-size: 11px; font-weight: 700; color: #C0BDB5; white-space: nowrap; margin-right: 2px; }

.ebtn {
  flex-shrink: 0;
  background: var(--surface);
  border: 2px solid var(--border);
  border-radius: 28px;
  padding: clamp(4px,1vw,7px) clamp(9px,2vw,14px);
  display: flex;
  align-items: center;
  gap: 4px;
  cursor: pointer;
  font-size: clamp(11px, 1.8vw, 13px);
  font-weight: 700;
  color: #666;
  font-family: inherit;
  transition: all 0.15s;
}
.ebtn:hover { border-color: var(--blue); color: var(--blue-dk); background: var(--blue-lt); }
.e-icon { font-size: clamp(16px, 3vw, 20px); }

/* ── 分類編輯列 ── */
.cat-edit-bar {
  background: #FFFBEB;
  border-bottom: 2px solid #FCD34D;
  padding: 7px var(--pad);
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.cat-edit-label { font-size: 12px; font-weight: 700; color: #92400E; }
.cat-edit-btn {
  background: #FEF3C7;
  border: 2px solid #FCD34D;
  border-radius: 9px;
  padding: 5px 12px;
  font-size: clamp(11px, 1.8vw, 13px);
  font-weight: 700;
  color: #92400E;
  cursor: pointer;
  font-family: inherit;
  transition: background 0.15s;
}
.cat-edit-btn:hover { background: #FDE68A; }
.cat-edit-btn.danger { background: #FEE2E2; border-color: #FCA5A5; color: #991B1B; }
.cat-edit-btn.danger:hover { background: #FECACA; }

/* ── 分類標籤（行動裝置水平滾動，桌機由側邊欄取代） ── */
.cat-tabs {
  background: var(--surface);
  border-bottom: 2px solid var(--border);
  display: flex;
  overflow-x: auto;
  padding: 0 8px;
  scrollbar-width: none;
}
.cat-tabs::-webkit-scrollbar { display: none; }
@media (min-width: 960px) { .cat-tabs { display: none; } }

.cat-tab {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 8px clamp(10px, 2.5vw, 16px);
  cursor: pointer;
  border-bottom: 3px solid transparent;
  margin-bottom: -2px;
  white-space: nowrap;
  min-width: clamp(55px, 12vw, 70px);
  transition: border-color 0.2s;
  user-select: none;
}
.cat-tab.active { border-bottom-color: var(--blue); }
.cat-icon { font-size: clamp(18px, 4vw, 24px); margin-bottom: 2px; }
.cat-name { font-size: clamp(10px, 2vw, 12px); font-weight: 700; color: var(--muted); }
.cat-tab.active .cat-name { color: var(--blue); }

/* ── 圖卡格線 ── */
.symbol-grid {
  padding: var(--pad);
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(var(--card-min), 1fr));
  gap: var(--gap);
  align-content: start;
  flex: 1;
}

/* 桌機：更大的卡片 */
@media (min-width: 960px) {
  :root { --card-min: clamp(110px, 12vw, 160px); --visual-size: clamp(60px, 9vw, 88px); --emoji-size: clamp(38px, 6vw, 54px); }
}
/* 大螢幕 */
@media (min-width: 1400px) {
  :root { --card-min: 160px; --visual-size: 90px; --emoji-size: 56px; }
}
/* 超小手機 */
@media (max-width: 360px) {
  :root { --card-min: 85px; --visual-size: 46px; --emoji-size: 30px; }
}

.symbol-card {
  background: var(--surface);
  border: 3px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 8px 10px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 7px;
  transition: border-color 0.15s, transform 0.12s, box-shadow 0.15s;
  user-select: none;
  position: relative;
  overflow: hidden;
}
.symbol-card:hover { border-color: var(--blue); transform: translateY(-2px) scale(1.03); box-shadow: 0 6px 18px rgba(59,125,216,0.2); }
.symbol-card:active { transform: scale(0.97); }

/* 顏色主題 */
.symbol-card[data-color="red"]    { border-color:#F5C4B3; background:#FDF4F0; }
.symbol-card[data-color="red"]:hover    { border-color:#D85A30; box-shadow:0 6px 18px rgba(216,90,48,0.2); }
.symbol-card[data-color="green"]  { border-color:#B8E4C0; background:#F0FAF2; }
.symbol-card[data-color="green"]:hover  { border-color:#2E9B52; box-shadow:0 6px 18px rgba(46,155,82,0.2); }
.symbol-card[data-color="yellow"] { border-color:#FAD183; background:#FEFAED; }
.symbol-card[data-color="yellow"]:hover { border-color:#C48A00; box-shadow:0 6px 18px rgba(196,138,0,0.2); }
.symbol-card[data-color="blue"]   { border-color:#AAD4F8; background:#EBF5FF; }
.symbol-card[data-color="blue"]:hover   { border-color:var(--blue); }
.symbol-card[data-color="purple"] { border-color:#CECAF8; background:#F2F1FF; }
.symbol-card[data-color="purple"]:hover { border-color:#7B72E9; box-shadow:0 6px 18px rgba(123,114,233,0.2); }
.symbol-card[data-color="pink"]   { border-color:#F4C0D4; background:#FEF0F5; }
.symbol-card[data-color="pink"]:hover   { border-color:#D45380; box-shadow:0 6px 18px rgba(212,83,128,0.2); }
.symbol-card[data-color="gray"]   { border-color:#D3D0C8; background:#F7F6F3; }
.symbol-card[data-color="gray"]:hover   { border-color:#888077; }

.symbol-visual {
  width: var(--visual-size);
  height: var(--visual-size);
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 12px;
  overflow: hidden;
  flex-shrink: 0;
}
.symbol-visual img { width: 100%; height: 100%; object-fit: cover; }
.sym-emoji { font-size: var(--emoji-size); line-height: 1; }

.symbol-label {
  font-size: var(--label-size);
  font-weight: 700;
  text-align: center;
  color: var(--text);
  line-height: 1.25;
  word-break: break-all;
}

.edit-badge {
  position: absolute;
  top: 5px;
  right: 5px;
  background: var(--blue);
  color: white;
  font-size: 10px;
  font-weight: 700;
  padding: 2px 6px;
  border-radius: 7px;
  pointer-events: none;
}
.del-badge {
  position: absolute;
  top: 5px;
  left: 5px;
  background: var(--red);
  color: white;
  font-size: 14px;
  font-weight: 700;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  z-index: 10;
  transition: background 0.15s;
}
.del-badge:hover { background: var(--red-dk); }

.add-card {
  background: #F0F5FF;
  border: 3px dashed #AAD4F8;
  border-radius: var(--radius);
  padding: 12px 8px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  transition: background 0.15s, border-color 0.15s;
}
.add-card:hover { background: var(--blue-lt); border-color: var(--blue); }
.add-icon { font-size: 34px; color: var(--blue); line-height: 1; }
.add-label { font-size: 12px; font-weight: 700; color: var(--blue); }

/* ── 快速句子 ── */
.quick-area {
  background: var(--surface);
  border-top: 2px solid var(--border);
  padding: clamp(7px,1.5vw,10px) var(--pad);
  flex-shrink: 0;
}
.q-label { font-size: 11px; font-weight: 700; color: #C0BDB5; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 7px; }
.q-list { display: flex; gap: var(--gap); flex-wrap: wrap; }

.qbtn {
  background: #FFFBEB;
  border: 2px solid #FCD34D;
  border-radius: 22px;
  padding: clamp(5px,1vw,8px) clamp(10px,2vw,14px);
  font-size: clamp(12px, 1.8vw, 14px);
  font-weight: 700;
  color: #7A5000;
  cursor: pointer;
  font-family: inherit;
  transition: background 0.15s, transform 0.1s;
}
.qbtn:hover { background: #FEF3C7; transform: scale(1.03); }
.qbtn:active { transform: scale(0.97); }
.qbtn-add {
  background: #F0FDF4;
  border: 2px dashed #6EE7B7;
  color: #065F46;
  border-radius: 22px;
  padding: clamp(5px,1vw,8px) clamp(10px,2vw,14px);
  font-size: clamp(12px, 1.8vw, 14px);
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
}
.qbtn-add:hover { background: #D1FAE5; }
.qbtn-del {
  background: #FEF2F2;
  border: 2px solid #FCA5A5;
  color: #991B1B;
  border-radius: 22px;
  padding: clamp(5px,1vw,8px) clamp(10px,2vw,14px);
  font-size: clamp(12px, 1.8vw, 14px);
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
}
.qbtn-del:hover { background: #FEE2E2; }

/* ── Toast 通知 ── */
.toast {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%) translateY(70px);
  background: var(--green);
  color: white;
  padding: 11px 24px;
  border-radius: 30px;
  font-size: 15px;
  font-weight: 700;
  opacity: 0;
  transition: transform 0.3s cubic-bezier(.34,1.56,.64,1), opacity 0.25s;
  pointer-events: none;
  z-index: 1000;
  max-width: 92vw;
  text-align: center;
  box-shadow: 0 4px 20px rgba(0,0,0,0.2);
}
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
.toast.err { background: var(--red); }
.toast.warn { background: var(--amber); }

/* ── 模態框 ── */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 300;
  padding: 14px;
  backdrop-filter: blur(3px);
}

.modal {
  background: var(--surface);
  border-radius: 20px;
  padding: 20px 18px;
  width: 100%;
  max-width: 440px;
  display: flex;
  flex-direction: column;
  gap: 13px;
  max-height: 92vh;
  overflow-y: auto;
  box-shadow: 0 20px 60px rgba(0,0,0,0.25);
  scrollbar-width: thin;
}

.modal-title { font-size: 18px; font-weight: 900; color: var(--text); }
.modal-row { display: flex; flex-direction: column; gap: 6px; }
.modal-label { font-size: 13px; font-weight: 700; color: var(--muted); }

.modal-input {
  width: 100%;
  padding: 9px 13px;
  border: 2px solid var(--border);
  border-radius: 11px;
  font-size: 15px;
  font-family: inherit;
  color: var(--text);
  transition: border-color 0.15s;
  background: var(--bg);
}
.modal-input:focus { outline: none; border-color: var(--blue); background: white; }

/* 圖示來源標籤 */
.img-source-tabs {
  display: flex;
  border: 2px solid var(--border);
  border-radius: 11px;
  overflow: hidden;
  margin-bottom: 8px;
}
.ist {
  flex: 1;
  padding: 9px 0;
  text-align: center;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  background: white;
  border: none;
  color: var(--muted);
  font-family: inherit;
  transition: background 0.15s, color 0.15s;
}
.ist.active { background: var(--blue); color: white; }
.ist:not(.active):hover { background: var(--blue-lt); color: var(--blue-dk); }

/* Emoji 選擇器 */
.emoji-picker {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 3px;
  max-height: 130px;
  overflow-y: auto;
  border: 2px solid var(--border);
  border-radius: 11px;
  padding: 6px;
  scrollbar-width: thin;
}
.ep-btn {
  font-size: 21px;
  text-align: center;
  cursor: pointer;
  border-radius: 7px;
  padding: 3px;
  transition: background 0.1s;
}
.ep-btn:hover { background: var(--blue-lt); }
.ep-btn.selected { background: #C8E2FA; outline: 2px solid var(--blue); }

/* 相片上傳 */
.photo-panel { display: flex; flex-direction: column; gap: 9px; }
.photo-upload-zone {
  border: 2px dashed var(--blue);
  border-radius: 13px;
  padding: 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 7px;
  cursor: pointer;
  background: var(--blue-lt);
  transition: background 0.15s, border-color 0.15s;
}
.photo-upload-zone:hover { background: #D8EDFC; }
.puz-icon { font-size: 34px; }
.puz-text { font-size: 14px; font-weight: 700; color: var(--blue-dk); }
.puz-sub { font-size: 12px; color: var(--muted); }

.photo-preview-wrap { position: relative; display: flex; justify-content: center; }
.photo-preview { width: 140px; height: 140px; object-fit: cover; border-radius: 16px; border: 3px solid var(--green); box-shadow: var(--shadow); }
.photo-remove-btn {
  position: absolute;
  top: -6px;
  right: calc(50% - 76px);
  background: var(--red);
  border: none;
  border-radius: 50%;
  width: 26px;
  height: 26px;
  color: white;
  font-size: 14px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  box-shadow: var(--shadow);
}
.photo-row { display: flex; gap: 8px; }
.cam-btn {
  flex: 1;
  background: var(--blue-dk);
  color: white;
  border: none;
  border-radius: 10px;
  padding: 9px 10px;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
  transition: background 0.15s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
}
.cam-btn:hover { background: #0F3F80; }
.cam-btn.purple { background: #6D5FD8; }
.cam-btn.purple:hover { background: #5347B8; }

/* 目前圖示預覽 */
.current-visual-row {
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--bg);
  border-radius: 12px;
  padding: 10px 14px;
  border: 2px solid var(--border);
}
.cv-preview {
  width: 56px;
  height: 56px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 38px;
  background: white;
  border: 2px solid var(--border);
  overflow: hidden;
  flex-shrink: 0;
}
.cv-preview img { width: 100%; height: 100%; object-fit: cover; }
.cv-label { font-size: 13px; font-weight: 700; color: var(--text); }
.cv-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }

/* 顏色點 */
.color-row { display: flex; gap: 7px; flex-wrap: wrap; }
.color-dot {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  cursor: pointer;
  border: 3px solid transparent;
  transition: transform 0.15s;
}
.color-dot:hover { transform: scale(1.15); }
.color-dot.selected { border-color: var(--text); transform: scale(1.1); }

/* 模態框按鈕 */
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; align-items: center; }
.m-cancel {
  background: var(--bg);
  border: 2px solid var(--border);
  border-radius: 11px;
  padding: 9px 16px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  color: var(--muted);
  font-family: inherit;
  transition: background 0.15s;
}
.m-cancel:hover { background: #EDE9E2; }
.m-save {
  background: var(--blue);
  color: white;
  border: none;
  border-radius: 11px;
  padding: 9px 20px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
  transition: background 0.15s;
  box-shadow: 0 2px 8px rgba(59,125,216,0.35);
}
.m-save:hover { background: var(--blue-dk); }
.m-danger {
  background: #FEF2F2;
  color: var(--red);
  border: 2px solid #FCA5A5;
  border-radius: 11px;
  padding: 9px 14px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
  margin-right: auto;
  transition: background 0.15s;
}
.m-danger:hover { background: #FEE2E2; }

/* ── 備份模態框 ── */
.cloud-info {
  background: var(--blue-lt);
  border-radius: 10px;
  padding: 11px 14px;
  font-size: 12px;
  color: var(--blue-dk);
  line-height: 1.7;
  border: 1.5px solid #BAD9F5;
}
.cloud-section {
  border: 2px solid var(--border);
  border-radius: 14px;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 9px;
}
.cloud-section-title { font-size: 14px; font-weight: 700; color: var(--text); }
.cloud-section-desc { font-size: 12px; color: var(--muted); line-height: 1.6; }
.cloud-action-btn {
  width: 100%;
  padding: 11px 16px;
  border-radius: 11px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  border: none;
  font-family: inherit;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  transition: opacity 0.15s, transform 0.1s;
}
.cloud-action-btn:hover { opacity: 0.88; }
.cloud-action-btn:active { transform: scale(0.98); }
.btn-export { background: var(--blue); color: white; }
.btn-import { background: var(--green); color: white; }
.btn-reset  { background: #FEF2F2; color: var(--red); border: 2px solid #FCA5A5; }

.profile-row {
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--bg);
  border-radius: 13px;
  padding: 11px 14px;
  border: 2px solid var(--border);
}
.profile-avatar {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: var(--blue);
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-size: 18px;
  font-weight: 900;
  flex-shrink: 0;
}
.profile-name { font-size: 15px; font-weight: 700; }
.profile-sub { font-size: 11px; color: var(--muted); margin-top: 1px; }
.rename-btn {
  margin-left: auto;
  background: var(--blue-lt);
  border: none;
  border-radius: 9px;
  padding: 6px 11px;
  font-size: 12px;
  font-weight: 700;
  color: var(--blue-dk);
  cursor: pointer;
  font-family: inherit;
}
.rename-btn:hover { background: #C5DFF7; }

/* ── 設定面板 ── */
.settings-section {
  border: 2px solid var(--border);
  border-radius: 14px;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.settings-section-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 6px;
}
.toggle-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.toggle-label { font-size: 13px; font-weight: 600; color: var(--text); flex: 1; line-height: 1.4; }
.toggle-sub   { font-size: 11px; color: var(--muted); }
.toggle-switch {
  position: relative;
  width: 46px;
  height: 26px;
  flex-shrink: 0;
}
.toggle-switch input { opacity: 0; width: 0; height: 0; }
.toggle-track {
  position: absolute;
  inset: 0;
  background: #D1D5DB;
  border-radius: 13px;
  cursor: pointer;
  transition: background 0.2s;
}
.toggle-track::before {
  content: '';
  position: absolute;
  width: 20px; height: 20px;
  left: 3px; top: 3px;
  background: white;
  border-radius: 50%;
  transition: transform 0.2s;
  box-shadow: 0 1px 4px rgba(0,0,0,0.2);
}
.toggle-switch input:checked + .toggle-track { background: var(--blue); }
.toggle-switch input:checked + .toggle-track::before { transform: translateX(20px); }

.font-size-btns { display: flex; gap: 6px; }
.fs-btn {
  flex: 1;
  border: 2px solid var(--border);
  border-radius: 9px;
  padding: 8px 4px;
  background: white;
  cursor: pointer;
  font-family: inherit;
  font-weight: 700;
  color: var(--muted);
  text-align: center;
  transition: all 0.15s;
}
.fs-btn.active { border-color: var(--blue); background: var(--blue-lt); color: var(--blue-dk); }
.fs-btn:hover:not(.active) { border-color: #BBB; color: var(--text); }

.bg-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; }
.bg-dot {
  aspect-ratio: 1;
  border-radius: 10px;
  cursor: pointer;
  border: 3px solid transparent;
  transition: transform 0.15s, border-color 0.15s;
  position: relative;
  overflow: hidden;
}
.bg-dot:hover { transform: scale(1.08); }
.bg-dot.active { border-color: var(--text); }
.bg-dot.active::after {
  content: '✓';
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  font-weight: 900;
  color: white;
  text-shadow: 0 1px 3px rgba(0,0,0,0.5);
}

/* ── 帳號 / 使用者切換 ── */
.user-card {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  border: 2px solid var(--border);
  border-radius: 13px;
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
}
.user-card:hover { border-color: var(--blue); background: var(--blue-lt); }
.user-card.active-user { border-color: var(--blue); background: var(--blue-lt); }
.user-avatar {
  width: 40px; height: 40px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; font-weight: 900; flex-shrink: 0;
  color: white;
}
.user-info { flex: 1; }
.user-name { font-size: 14px; font-weight: 700; }
.user-sub  { font-size: 11px; color: var(--muted); margin-top: 1px; }
.user-check { font-size: 18px; color: var(--blue); }

.add-user-btn {
  width: 100%;
  padding: 10px;
  border: 2px dashed #AAD4F8;
  border-radius: 12px;
  background: #F7FBFF;
  color: var(--blue-dk);
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
  transition: background 0.15s;
}
.add-user-btn:hover { background: var(--blue-lt); }

/* ── 鎖定提示動畫 ── */
@keyframes shake {
  0%,100% { transform: translateX(0); }
  20%      { transform: translateX(-6px); }
  40%      { transform: translateX(6px); }
  60%      { transform: translateX(-4px); }
  80%      { transform: translateX(4px); }
}
.shake { animation: shake 0.4s ease; }

.edit-lock-hint {
  position: fixed;
  top: 60px;
  right: 14px;
  background: rgba(30,30,26,0.88);
  color: white;
  padding: 8px 14px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 700;
  pointer-events: none;
  z-index: 500;
  opacity: 0;
  transform: translateY(-6px);
  transition: opacity 0.2s, transform 0.2s;
}
.edit-lock-hint.show { opacity: 1; transform: translateY(0); }

/* ── 鎖定 UI：解鎖前隱藏 ── */
.locked-ui { display: none !important; }
body.unlocked .locked-ui { display: revert !important; }
body.unlocked .vol-wrap.locked-ui   { display: flex !important; }
body.unlocked .ctrl-group.locked-ui { display: flex !important; }
body.unlocked .tbtn.locked-ui       { display: inline-flex !important; align-items:center; }
body.unlocked .ctrl-btn-full.locked-ui { display: flex !important; }

/* 感覺按鈕（快速句子區） */
.qbtn.emotion-btn {
  background: #FEF3FF;
  border-color: #DDB8F0;
  color: #7B2FA8;
}
.qbtn.emotion-btn:hover { background: #F7E3FF; }

@keyframes pop {
  0%   { transform: scale(1); }
  40%  { transform: scale(1.14); }
  100% { transform: scale(1); }
}
.pop { animation: pop 0.22s ease; }

@keyframes fadeIn {
  from { opacity: 0; transform: scale(0.95); }
  to   { opacity: 1; transform: scale(1); }
}
.modal { animation: fadeIn 0.2s ease; }

/* ── 無障礙 ── */
.sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }

/* ── 自適應細調 ── */

/* 平板橫向 */
@media (min-width: 600px) and (max-width: 959px) {
  .sentence-bar { min-height: 74px; }
}

/* 桌機：隱藏行動裝置元件 */
@media (min-width: 960px) {
  .cat-edit-bar { padding: 7px 16px; }
  .symbol-grid  { padding: 16px; }
  .quick-area   { padding: 10px 16px; }
  .sentence-bar { padding: 10px 16px; min-height: 80px; }
}

/* 超小手機 */
@media (max-width: 360px) {
  .speak-btn { padding: 7px 10px; }
  .tbtn      { padding: 5px 8px; font-size: 11px; }
  .chip      { padding: 3px 9px; font-size: 12px; }
}

/* 觸控裝置：加大點擊區域 */
@media (hover: none) and (pointer: coarse) {
  .symbol-card { padding: 14px 8px 12px; }
  .qbtn, .qbtn-del, .qbtn-add { padding: 8px 14px; }
  .ebtn { padding: 7px 13px; }
  .cat-tab { padding: 10px 16px; }
}

/* 列印 */
@media print {
  .top-bar, .sentence-bar, .emotion-bar, .cat-edit-bar, .quick-area,
  .sidebar-controls, .sidebar-brand { display: none !important; }
}
</style>
</head>
<body>

<h1 class="sr-only">我的溝通板 — AAC 擴大替代性溝通系統</h1>

<div class="app-layout">

<!-- ════ 桌機側邊欄 ════ -->
<aside class="sidebar" role="complementary" aria-label="側邊功能列">

  <!-- 品牌 -->
  <div class="sidebar-brand">
    <div class="sidebar-brand-title" id="appTitleDesktop" onclick="openRenameTitle()"
         title="點擊修改標題" style="cursor:pointer; display:flex; align-items:center; gap:6px;">
      <span id="appTitleDesktopText">🗣️ 我的溝通板</span>
      <span style="font-size:12px; opacity:0.6;">✏️</span>
    </div>
    <div class="sidebar-brand-sub">AAC 擴大替代性溝通系統</div>
  </div>

  <!-- 桌機控制 -->
  <div class="sidebar-controls">
    <div class="ctrl-group locked-ui">
      <div class="ctrl-label">語音設定</div>
      <div class="vol-row">
        <span>🔊</span>
        <input type="range" id="volSliderDesktop" min="0" max="1" step="0.1" value="0.8"
               aria-label="音量" oninput="syncVol(this.value)">
        <span id="volPct" style="font-size:11px;color:var(--muted);white-space:nowrap;">80%</span>
      </div>
      <button class="ctrl-btn-full" id="rateBtnDesktop" onclick="cycleRate()">⏱ 速度：正常</button>
    </div>
    <div class="ctrl-group">
      <div class="ctrl-label">模式</div>
      <button class="ctrl-btn-full" id="editBtnDesktop" onclick="requestEdit()">✏️ 進入編輯模式</button>
      <button class="ctrl-btn-full cloud locked-ui" onclick="openCloudModal()">☁️ 備份 / 還原</button>
      <button class="ctrl-btn-full locked-ui" onclick="openSettings()" style="background:#F3F0EB;">⚙️ 外觀設定</button>
      <button class="ctrl-btn-full locked-ui" onclick="openUserPanel()" style="background:#F3F0EB;">👤 切換使用者</button>
    </div>
  </div>

  <!-- 桌機分類列表 -->
  <div class="sidebar-cats" id="sidebarCats" role="tablist" aria-label="溝通分類"></div>

</aside>

<!-- ════ 主內容區 ════ -->
<div class="main-area">

<!-- 頂部列 -->
<div class="top-bar" role="banner">
  <div class="app-title" id="appTitleMobile" onclick="openRenameTitle()" title="點擊修改標題" style="cursor:pointer;">🗣️ 我的溝通板</div>
  <div class="top-right">
    <div class="vol-wrap locked-ui" aria-label="音量控制">
      <span>🔊</span>
      <input type="range" id="volSlider" min="0" max="1" step="0.1" value="0.8" aria-label="音量">
    </div>
    <button class="tbtn locked-ui" id="rateBtn" onclick="cycleRate()" aria-label="切換語速">速度:正常</button>
    <button class="tbtn locked-ui" onclick="openSettings()" aria-label="外觀設定">⚙️</button>
    <button class="tbtn locked-ui" onclick="openUserPanel()" aria-label="切換使用者">👤</button>
    <button class="tbtn" id="editToggleShow" onclick="requestEdit()" aria-label="進入編輯模式">✏️ 編輯</button>
    <button class="tbtn done" id="editToggleDone" onclick="toggleEdit()" style="display:none;" aria-label="完成編輯">✅ 完成</button>
    <button class="tbtn cloud-btn-top locked-ui" onclick="openCloudModal()" aria-label="備份與還原">☁️</button>
  </div>
</div>

<!-- 鎖定提示 -->
<div class="edit-lock-hint" id="editLockHint"></div>

<!-- 句子列 -->
<div class="sentence-bar" role="region" aria-label="句子組成區">
  <div class="s-label" aria-hidden="true">我說：</div>
  <div class="s-chips" id="sChips" role="list" aria-label="已選圖卡">
    <span style="color:#C0BDB5;font-size:13px;">點擊圖卡來說話...</span>
  </div>
  <div class="s-actions">
    <button class="speak-btn" onclick="speakSentence()" aria-label="朗讀句子">▶ 說出來</button>
    <button class="clear-btn" onclick="clearSentence()" aria-label="清除句子">✕</button>
  </div>
</div>

<!-- 分類編輯列（編輯模式顯示） -->
<div id="catEditBar" class="cat-edit-bar" style="display:none;" role="toolbar" aria-label="分類管理">
  <span class="cat-edit-label">📂 分類管理：</span>
  <button class="cat-edit-btn" onclick="openAddCat()">＋ 新增分類</button>
  <button class="cat-edit-btn" onclick="openRenameCat()">✏️ 重新命名</button>
  <button class="cat-edit-btn danger" onclick="deleteCat()">🗑 刪除分類</button>
</div>

<!-- 分類標籤 -->
<div class="cat-tabs" id="catTabs" role="tablist" aria-label="溝通分類"></div>

<!-- 圖卡格線 -->
<div class="symbol-grid" id="symbolGrid" role="main" aria-label="溝通圖卡"></div>

<!-- 快速句子（含感覺區塊） -->
<div class="quick-area" role="region" aria-label="快速句子與情緒">
  <div class="q-label">💛 感覺</div>
  <div class="q-list" id="emotionList">
    <button class="qbtn emotion-btn" onclick="speakEmotion('我很開心')">😊 開心</button>
    <button class="qbtn emotion-btn" onclick="speakEmotion('我很難過')">😢 難過</button>
    <button class="qbtn emotion-btn" onclick="speakEmotion('我很生氣')">😠 生氣</button>
    <button class="qbtn emotion-btn" onclick="speakEmotion('我很害怕')">😨 害怕</button>
    <button class="qbtn emotion-btn" onclick="speakEmotion('我很累了')">😴 累了</button>
    <button class="qbtn emotion-btn" onclick="speakEmotion('我不舒服')">🤒 不舒服</button>
    <button class="qbtn emotion-btn" onclick="speakEmotion('我需要休息')">💤 休息</button>
    <button class="qbtn emotion-btn" onclick="speakEmotion('我感到焦慮')">😰 焦慮</button>
  </div>
  <div class="q-label" style="margin-top:10px;">⚡ 快速句子</div>
  <div class="q-list" id="qList"></div>
</div>

<!-- Toast 通知 -->
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- 模態框容器 -->
<div id="overlayRoot"></div>

</div><!-- /.main-area -->
</div><!-- /.app-layout -->

<!-- 隱藏 file inputs（放在 body 最外層，不受 modal 生命週期影響） -->
<input type="file" id="fileInput"   accept=".json"  style="display:none;">
<input type="file" id="photoInput"  accept="image/*" style="display:none;">
<input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none;">

<script>
/* ══════════════════════════════════════════════
   資料 & 常數
══════════════════════════════════════════════ */
const COLORS = ['red','green','yellow','blue','purple','pink','gray'];
const COLOR_HEX = {
  red:'#F5C4B3', green:'#B8E4C0', yellow:'#FAD183',
  blue:'#AAD4F8', purple:'#CECAF8', pink:'#F4C0D4', gray:'#D3D0C8'
};

/* ══════════════════════════════════════════════
   語音
══════════════════════════════════════════════ */
let voices = [];
function initVoices() {
  voices = speechSynthesis.getVoices().filter(v => v.lang.startsWith('zh'));
  if (!voices.length) voices = speechSynthesis.getVoices();
}
if (speechSynthesis.onvoiceschanged !== undefined)
  speechSynthesis.onvoiceschanged = initVoices;
setTimeout(initVoices, 400);

function speak(text) {
  if (!text) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang   = 'zh-TW';
  u.rate   = rates[rateIdx].val;
  // 手機/桌機滑桿都能控音量
  const mobileVol  = parseFloat(document.getElementById('volSlider')?.value || 0.8);
  const desktopVol = parseFloat(document.getElementById('volSliderDesktop')?.value || 0.8);
  u.volume = Math.max(mobileVol, desktopVol);
  if (voices.length) u.voice = voices[0];
  speechSynthesis.speak(u);
}

function cycleRate() {
  rateIdx = (rateIdx + 1) % rates.length;
  document.getElementById('rateBtn').textContent = '速度:' + rates[rateIdx].label;
  const d = document.getElementById('rateBtnDesktop');
  if (d) d.textContent = '⏱ 速度：' + rates[rateIdx].label;
}

/* ══════════════════════════════════════════════
   本機儲存
══════════════════════════════════════════════ */
function loadState() {
  try {
    const raw = localStorage.getItem('aac_v4');
    if (raw) {
      const d = JSON.parse(raw);
      cats          = d.cats         || cloneDefault('cats');
      symbols       = d.symbols      || cloneDefault('symbols');
      quickPhrases  = d.quickPhrases || cloneDefault('quickPhrases');
      profileName   = d.profileName  || '使用者';
      appTitle      = d.appTitle     || '🗣️ 我的溝通板';
      lastSavedAt   = d.savedAt      || null;
      settings      = Object.assign({ soundOnClick:true, fontSize:'normal', bgColor:'#FFF9F2' }, d.settings || {});
      users         = d.users        || [];
      currentUserId = d.currentUserId|| null;
      if (!cats.find(c => c.id === currentCat)) currentCat = cats[0]?.id || 'need';
      return;
    }
  } catch(e) {}
  resetToDefault(false);
}

function saveState() {
  try {
    const d = { cats, symbols, quickPhrases, profileName, appTitle, settings, users, currentUserId, savedAt: new Date().toISOString() };
    localStorage.setItem('aac_v4', JSON.stringify(d));
    lastSavedAt = d.savedAt;
  } catch(e) { showToast('儲存失敗：空間不足', 'err'); }
}

function cloneDefault(key) {
  return JSON.parse(JSON.stringify(DEFAULT_DATA[key]));
}

function renderTitle() {
  // 手機頂部
  const mobile = document.getElementById('appTitleMobile');
  if (mobile) mobile.textContent = appTitle;
  // 桌機側邊欄
  const desktop = document.getElementById('appTitleDesktopText');
  if (desktop) desktop.textContent = appTitle;
  // 瀏覽器分頁標題
  document.title = appTitle + ' — AAC 輔助溝通系統';
}

function openRenameTitle() {
  openModal(`<div class="modal" onclick="event.stopPropagation()">
    <div class="modal-title">✏️ 修改溝通板標題</div>
    <div class="modal-row">
      <div class="modal-label">標題名稱</div>
      <input class="modal-input" id="titleInput" value="${esc(appTitle)}"
             placeholder="例如：小明的溝通板" maxlength="20"
             aria-label="標題名稱">
    </div>
    <div style="font-size:12px;color:var(--muted);line-height:1.6;">
      💡 可加入學生姓名，例如「🗣️ 小明的溝通板」<br>
      支援 emoji，讓標題更活潑！
    </div>
    <div class="modal-actions">
      <button class="m-cancel" onclick="forceClose()">取消</button>
      <button class="m-save" onclick="saveTitle()">儲存標題</button>
    </div>
  </div>`);
  setTimeout(() => {
    const inp = document.getElementById('titleInput');
    if (inp) { inp.focus(); inp.select(); }
  }, 80);
}

function saveTitle() {
  const inp = document.getElementById('titleInput');
  const val = inp?.value.trim();
  if (!val) { alert('請輸入標題'); return; }
  appTitle = val;
  renderTitle();
  saveState();
  forceClose();
  showToast('✅ 標題已更新：' + val);
}

/* ══════════════════════════════════════════════
   UI 渲染
══════════════════════════════════════════════ */
function renderAll() { renderCatTabs(); renderSidebarCats(); renderSymbols(); renderQuickPhrases(); }

function renderCatTabs() {
  document.getElementById('catTabs').innerHTML =
    cats.map(c => `
      <div class="cat-tab ${c.id === currentCat ? 'active' : ''}"
           onclick="selectCat('${c.id}')"
           role="tab"
           aria-selected="${c.id === currentCat}"
           aria-label="${c.name}">
        <span class="cat-icon">${c.icon}</span>
        <span class="cat-name">${c.name}</span>
      </div>`).join('');
}

function renderSidebarCats() {
  const el = document.getElementById('sidebarCats'); if (!el) return;
  el.innerHTML = cats.map(c => {
    const count = (symbols[c.id] || []).length;
    return `<div class="sidebar-cat-item ${c.id === currentCat ? 'active' : ''}"
                 onclick="selectCat('${c.id}')"
                 role="tab" aria-selected="${c.id === currentCat}" aria-label="${c.name}">
              <span class="sidebar-cat-icon">${c.icon}</span>
              <span>${c.name}</span>
              <span class="sidebar-cat-count">${count}</span>
            </div>`;
  }).join('');
}

function selectCat(id) { currentCat = id; renderAll(); }

function cardVisualHTML(s) {
  if (s.photo)
    return `<div class="symbol-visual"><img src="${s.photo}" alt="${esc(s.label)}" loading="lazy"></div>`;
  return `<div class="symbol-visual"><span class="sym-emoji">${s.emoji || '🌟'}</span></div>`;
}

function renderSymbols() {
  const list = symbols[currentCat] || [];
  let html = list.map((s, i) => `
    <div class="symbol-card"
         data-color="${s.color || 'blue'}"
         onclick="${editMode ? `openEditSymbol(${i})` : `onSymbolClick(this,${i})`}"
         role="${editMode ? 'button' : 'button'}"
         aria-label="${s.label}">
      ${editMode ? `<div class="del-badge" onclick="event.stopPropagation();deleteSymbol(${i})" aria-label="刪除 ${s.label}">✕</div>` : ''}
      ${cardVisualHTML(s)}
      <div class="symbol-label">${s.label}</div>
      ${editMode ? '<div class="edit-badge">編輯</div>' : ''}
    </div>`).join('');
  if (editMode)
    html += `<div class="add-card" onclick="openAddSymbol()" role="button" aria-label="新增圖卡">
               <div class="add-icon">＋</div>
               <div class="add-label">新增圖卡</div>
             </div>`;
  document.getElementById('symbolGrid').innerHTML = html;
}

function renderQuickPhrases() {
  const q = document.getElementById('qList');
  let html = quickPhrases.map((p, i) => {
    if (editMode)
      return `<button class="qbtn-del" onclick="deleteQuick(${i})">${p.emoji} ${p.text} ✕</button>`;
    return `<button class="qbtn" onclick="quickSpeak(${i})">${p.emoji} ${p.text}</button>`;
  }).join('');
  if (editMode)
    html += `<button class="qbtn-add" onclick="openAddQuick()">＋ 新增句子</button>`;
  q.innerHTML = html;
}

function renderSentence() {
  const c = document.getElementById('sChips');
  if (!sentence.length) {
    c.innerHTML = '<span style="color:#C0BDB5;font-size:13px;">點擊圖卡來說話...</span>';
    return;
  }
  c.innerHTML = sentence.map((s, i) => `
    <div class="chip" onclick="removeFromSentence(${i})" role="button" aria-label="移除 ${s.label}" title="點擊移除">
      ${s.photo ? `<img class="chip-photo" src="${s.photo}" alt="">` :
                  (s.emoji ? `<span>${s.emoji}</span>` : '')}
      <span>${s.label}</span>
    </div>`).join('');
}

/* ══════════════════════════════════════════════
   編輯鎖定（需連點 4 次）
══════════════════════════════════════════════ */
function requestEdit() {
  if (editMode) { toggleEdit(); return; }
  editClickCount++;
  clearTimeout(editClickTimer);

  const remaining = 4 - editClickCount;
  const hint = document.getElementById('editLockHint');

  if (editClickCount >= 4) {
    editClickCount = 0;
    hint.textContent = '✅ 進入編輯模式';
    hint.classList.add('show');
    setTimeout(() => hint.classList.remove('show'), 1200);
    // 解鎖 UI
    document.body.classList.add('unlocked');
    toggleEdit();
    return;
  }

  hint.textContent = `🔒 再點 ${remaining} 次解鎖編輯`;
  hint.classList.add('show');

  const btn = document.getElementById('editToggleShow');
  btn?.classList.add('shake');
  setTimeout(() => btn?.classList.remove('shake'), 400);

  editClickTimer = setTimeout(() => {
    editClickCount = 0;
    hint.classList.remove('show');
  }, 2000);
}

function toggleEdit() {
  editMode = !editMode;
  document.getElementById('editToggleShow').style.display = editMode ? 'none' : '';
  document.getElementById('editToggleDone').style.display = editMode ? '' : 'none';
  document.getElementById('catEditBar').style.display     = editMode ? 'flex' : 'none';

  // 退出編輯時鎖回 UI
  if (!editMode) {
    document.body.classList.remove('unlocked');
  }

  const desktopBtn = document.getElementById('editBtnDesktop');
  if (desktopBtn) {
    desktopBtn.classList.toggle('active', editMode);
    desktopBtn.textContent = editMode ? '✅ 完成編輯' : '✏️ 進入編輯模式';
  }
  if (!editMode) { saveState(); showToast('✅ 已自動儲存'); }
  renderAll();
}

function syncVol(v) {
  document.getElementById('volSlider').value = v;
  const pct = document.getElementById('volPct');
  if (pct) pct.textContent = Math.round(v * 100) + '%';
}

function speakEmotion(text) {
  speak(text);
  sentence.push({ emoji: '', label: text, photo: null });
  renderSentence();
  showToast(text);
}

function onSymbolClick(el, i) {
  const s = (symbols[currentCat] || [])[i];
  if (!s) return;
  if (settings.soundOnClick) speak(s.label);
  sentence.push({ emoji: s.emoji, label: s.label, photo: s.photo || null });
  renderSentence();
  el.classList.add('pop');
  setTimeout(() => el.classList.remove('pop'), 220);
}

function removeFromSentence(i) {
  sentence.splice(i, 1);
  renderSentence();
}

function speakSentence() {
  if (!sentence.length) { speak('請選擇圖卡'); return; }
  const text = sentence.map(s => s.label).join('，');
  speak(text);
  showToast('▶ ' + text.slice(0, 30) + (text.length > 30 ? '…' : ''));
}

function clearSentence() { sentence = []; renderSentence(); }

function quickSpeak(i) {
  const p = quickPhrases[i]; if (!p) return;
  speak(p.text);
  sentence.push({ emoji: p.emoji, label: p.text, photo: null });
  renderSentence();
  showToast(p.text);
}

function deleteSymbol(i) {
  if (!confirm('確定要刪除這張圖卡嗎？')) return;
  (symbols[currentCat] || []).splice(i, 1);
  renderSymbols();
}

function deleteQuick(i) {
  if (!confirm('確定刪除這個快速句子？')) return;
  quickPhrases.splice(i, 1);
  renderQuickPhrases();
}

/* ══════════════════════════════════════════════
   Toast
══════════════════════════════════════════════ */
let _toastTimer = null;
function showToast(msg, type = '') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' ' + type : '');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}

/* ══════════════════════════════════════════════
   模態框工具
══════════════════════════════════════════════ */
function openModal(html) {
  const root = document.getElementById('overlayRoot');
  root.innerHTML = `<div class="overlay" onclick="closeModalOuter(event)" role="dialog" aria-modal="true">${html}</div>`;
}
function closeModalOuter(e) {
  if (e.target.classList.contains('overlay')) forceClose();
}
function forceClose() {
  document.getElementById('overlayRoot').innerHTML = '';
  _pendingPhoto     = null;
  _pendingPhotoMode = 'emoji';
}
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
                  .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function switchImgTab(tab) {
  _pendingPhotoMode = tab;
  document.querySelectorAll('.ist').forEach(b =>
    b.classList.toggle('active', b.dataset.tab === tab));
  document.getElementById('emojiPanel').style.display = tab === 'emoji' ? '' : 'none';
  document.getElementById('photoPanel').style.display = tab === 'photo' ? '' : 'none';
  updateCurrentVisual();
}

function updateCurrentVisual() {
  const wrap = document.getElementById('cvPreview'); if (!wrap) return;
  if (_pendingPhotoMode === 'photo' && _pendingPhoto) {
    wrap.innerHTML = `<img src="${_pendingPhoto}" style="width:100%;height:100%;object-fit:cover;">`;
  } else {
    const e = document.getElementById('modalEmoji')?.value || '🌟';
    wrap.innerHTML = e;
  }
}

function handlePhotoSelect(e) {
  const file = e.target.files[0]; if (!file) return;
  if (!file.type.startsWith('image/')) { showToast('請選擇圖片檔案', 'err'); return; }
  const reader = new FileReader();
  reader.onload = ev => compressImage(ev.target.result, 260, result => {
    _pendingPhoto = result;
    renderPhotoPanel();
    updateCurrentVisual();
  });
  reader.readAsDataURL(file);
  e.target.value = '';
}

function compressImage(src, maxSize, cb) {
  const img = new Image();
  img.onload = () => {
    const canvas = document.createElement('canvas');
    let w = img.width, h = img.height;
    if (w > h) { if (w > maxSize) { h = Math.round(h * maxSize / w); w = maxSize; } }
    else        { if (h > maxSize) { w = Math.round(w * maxSize / h); h = maxSize; } }
    canvas.width = w; canvas.height = h;
    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
    cb(canvas.toDataURL('image/jpeg', 0.82));
  };
  img.src = src;
}

function renderPhotoPanel() {
  const panel = document.getElementById('photoPanel'); if (!panel) return;
  if (_pendingPhoto) {
    panel.innerHTML = `
      <div class="photo-preview-wrap">
        <img class="photo-preview" src="${_pendingPhoto}" alt="預覽相片">
        <button class="photo-remove-btn" onclick="removePhoto()" aria-label="移除相片">✕</button>

/* ── 備份資料建立 / 套用 ── */
function buildBackupData() {
  saveState();
  return {
    version: 4, exportedAt: new Date().toISOString(),
    profileName, appTitle, cats, symbols, quickPhrases,
    meta: {
      totalCards: Object.values(symbols).reduce((a,b)=>a+(b?.length||0),0),
      totalCats: cats.length
    }
  };
}

function applyBackupData(d) {
  if (!d.cats || !d.symbols || !d.quickPhrases) throw new Error('格式錯誤');
  cats         = d.cats;
  symbols      = d.symbols;
  quickPhrases = d.quickPhrases;
  profileName  = d.profileName || profileName;
  appTitle     = d.appTitle    || appTitle;
  if (d.settings) settings = Object.assign({ soundOnClick:true, fontSize:'normal', bgColor:'#FFF9F2' }, d.settings);
  if (!cats.find(c => c.id === currentCat)) currentCat = cats[0]?.id || 'need';
  forceClose();
  saveState();
  applySettings();
  renderAll();
  renderTitle();
}

function fmtTime(iso) {
  if (!iso) return '尚未儲存';
  try {
    const d = new Date(iso);
    return d.toLocaleDateString('zh-TW') + '  ' +
           d.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' });
  } catch { return '未知'; }
}

  }

function copyBackupToClipboard() {
  saveState();
  const json = JSON.stringify(buildBackupData());
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(json).then(() => {
      showToast('✅ 備份內容已複製！可貼到記事本另存為 .json');
      forceClose();
    }).catch(() => fallbackCopyBackup(json));
  } else {
    fallbackCopyBackup(json);
  }
}

function fallbackCopyBackup(json) {
  const ta = document.createElement('textarea');
  ta.value = json;
  ta.style.cssText = 'position:fixed;top:-9999px;left:-9999px;opacity:0;';
  document.body.appendChild(ta);
  ta.focus(); ta.select();
  try {
    document.execCommand('copy');
    showToast('✅ 備份內容已複製！可貼到記事本另存為 .json');
    forceClose();
  } catch(e) {
    showToast('❌ 複製失敗，請改用下載方式', 'err');
  }
  document.body.removeChild(ta);
}

function exportData() {
  saveState();
  const data  = buildBackupData();
  const json  = JSON.stringify(data);
  const d     = new Date();
  const fname = `AAC溝通板_${profileName}_${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}.json`;

  try {
    // 方法一：Blob（一般瀏覽器）
    const blob = new Blob([json], { type: 'application/octet-stream' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href     = url;
    a.download = fname;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(url); document.body.removeChild(a); }, 1000);
    showToast('✅ 備份檔已下載');
    forceClose();
  } catch(e) {
    // 方法二：textarea 複製（備用）
    forceClose();
    openModal(`<div class="modal" onclick="event.stopPropagation()">
      <div class="modal-title">📋 手動儲存備份</div>
      <div style="font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:8px;">
        瀏覽器限制自動下載，請全選以下內容並複製，貼到記事本後儲存為 <strong>.json</strong> 檔案。
      </div>
      <textarea id="backupText" readonly
        style="width:100%;height:160px;font-family:monospace;font-size:11px;padding:8px;border:2px solid var(--border);border-radius:10px;resize:none;"
      ></textarea>
      <div class="modal-actions">
        <button class="m-cancel" onclick="forceClose()">關閉</button>
        <button class="m-save" onclick="copyBackupText()">📋 全選並複製</button>
      </div>
    </div>`);
    document.getElementById('backupText').value = json;
  }
}

function copyBackupText() {
  const ta = document.getElementById('backupText');
  ta.select();
  try {
    document.execCommand('copy');
    showToast('✅ 已複製！請貼到記事本儲存為 .json');
  } catch(e) {
    navigator.clipboard?.writeText(ta.value).then(() => showToast('✅ 已複製！'));
  }
}

function openPasteRestore() {
  forceClose();
  openModal(`<div class="modal" onclick="event.stopPropagation()">
    <div class="modal-title">📋 貼上 JSON 還原</div>
    <div style="font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:4px;">
      用記事本開啟備份 .json 檔案，全選內容（Ctrl+A），複製（Ctrl+C），再貼到下方：
    </div>
    <textarea id="pasteArea"
      style="width:100%;height:180px;font-family:monospace;font-size:11px;padding:8px;
             border:2px solid var(--border);border-radius:10px;resize:vertical;"
      placeholder='將 JSON 內容貼在這裡...'></textarea>
    <div id="pasteError" style="color:var(--red);font-size:12px;font-weight:700;display:none;"></div>
    <div class="modal-actions">
      <button class="m-cancel" onclick="forceClose()">取消</button>
      <button class="m-save" onclick="doRestoreFromText()">✅ 套用還原</button>
    </div>
  </div>`);
  setTimeout(() => document.getElementById('pasteArea')?.focus(), 80);
}

function doRestoreFromText() {
  const text = document.getElementById('pasteArea')?.value?.trim();
  const errEl = document.getElementById('pasteError');

  if (!text) {
    errEl.textContent = '❌ 請先貼上備份內容';
    errEl.style.display = '';
    return;
  }

  let d;
  try {
    d = JSON.parse(text);
  } catch(err) {
    errEl.textContent = '❌ 無法解析 JSON，請確認內容完整：' + err.message;
    errEl.style.display = '';
    return;
  }

  if (!Array.isArray(d.cats) || typeof d.symbols !== 'object' || !Array.isArray(d.quickPhrases)) {
    errEl.textContent = '❌ 備份格式不正確，缺少必要欄位';
    errEl.style.display = '';
    return;
  }

  const catCount  = d.cats.length;
  const cardCount = Object.values(d.symbols).reduce((a, b) => a + (Array.isArray(b) ? b.length : 0), 0);

  if (!confirm('確定匯入「' + (d.profileName || '未知') + '」的備份？\n' +
               catCount + ' 個分類・' + cardCount + ' 張圖卡\n\n⚠️ 將覆蓋目前所有設定')) {
    return;
  }

  cats         = d.cats;
  symbols      = d.symbols;
  quickPhrases = d.quickPhrases;
  profileName  = d.profileName || profileName;
  appTitle     = d.appTitle    || appTitle;

  if (d.settings && typeof d.settings === 'object') {
    settings = Object.assign({ soundOnClick: true, fontSize: 'normal', bgColor: '#FFF9F2' }, d.settings);
  }

  if (!cats.find(function(c) { return c.id === currentCat; })) {
    currentCat = cats[0] ? cats[0].id : 'need';
  }

  forceClose();
  saveState();
  applySettings();
  renderAll();
  renderTitle();

  showToast('✅ 已還原！' + catCount + ' 個分類・' + cardCount + ' 張圖卡');
}

function triggerFileImport() {
  // 先關閉 modal，再開檔案選擇器，避免 modal DOM 被清除後 change 事件消失
  forceClose();
  setTimeout(() => {
    const inp = document.createElement('input');
    inp.type   = 'file';
    inp.accept = '.json';
    inp.style.display = 'none';
    document.body.appendChild(inp);
    inp.addEventListener('change', ev => {
      handleFileImport(ev);
      document.body.removeChild(inp);
    });
    inp.click();
  }, 80);
}

function handleFileImport(e) {
  const file = e.target.files[0];
  if (!file) return;
  if (!file.name.endsWith('.json')) {
    showToast('請選擇 .json 檔案', 'err');
    e.target.value = '';
    return;
  }

  const reader = new FileReader();
  reader.onerror = () => {
    showToast('❌ 讀取檔案失敗', 'err');
    e.target.value = '';
  };
  reader.onload = ev => {
    e.target.value = '';
    let d;
    // 1. 解析 JSON
    try {
      d = JSON.parse(ev.target.result);
    } catch(parseErr) {
      showToast('❌ 檔案內容不是有效的 JSON', 'err');
      return;
    }

    // 2. 基本結構檢查
    if (!d.cats || !Array.isArray(d.cats) ||
        !d.symbols || typeof d.symbols !== 'object' ||
        !d.quickPhrases || !Array.isArray(d.quickPhrases)) {
      showToast('❌ 備份格式不正確，請確認檔案來源', 'err');
      return;
    }

    // 3. 確認視窗
    const catCount  = d.cats.length;
    const cardCount = d.meta?.totalCards ||
                      Object.values(d.symbols).reduce((a,b)=>a+(Array.isArray(b)?b.length:0),0);
    const info = `確定要匯入「${d.profileName||'未知'}」的備份資料？\n` +
                 `（${catCount} 個分類 · ${cardCount} 張圖卡）\n\n` +
                 `⚠️ 匯入後將覆蓋目前所有設定。`;
    if (!confirm(info)) return;

    // 4. 套用資料
    try {
      cats         = d.cats;
      symbols      = d.symbols;
      quickPhrases = d.quickPhrases;
      profileName  = d.profileName  || profileName;
      appTitle     = d.appTitle     || appTitle;
      if (d.settings) {
        settings = Object.assign(
          { soundOnClick: true, fontSize: 'normal', bgColor: '#FFF9F2' },
          d.settings
        );
      }
      // 確保 currentCat 有效
      if (!cats.find(c => c.id === currentCat)) {
        currentCat = cats[0]?.id || 'need';
      }

      // 5. 先關閉所有 modal，再存檔、套用、渲染
      forceClose();
      saveState();
      applySettings();
      renderAll();
      renderTitle();

      showToast(`✅ 已還原「${profileName}」：${cats.length} 個分類、${cardCount} 張圖卡`);
    } catch(applyErr) {
      showToast('❌ 套用備份時出錯：' + applyErr.message, 'err');
    }
  };
  reader.readAsText(file, 'UTF-8');
}

function resetToDefault(withConfirm = true) {
  if (withConfirm && !confirm('確定要重設為預設值？所有自訂圖卡、相片和分類將全部清除。')) return;
  cats         = cloneDefault('cats');
  symbols      = cloneDefault('symbols');
  quickPhrases = cloneDefault('quickPhrases');
  currentCat   = 'need';
  saveState(); renderAll();
  if (withConfirm) { forceClose(); showToast('✅ 已重設為預設值'); }
}

/* ══════════════════════════════════════════════
   外觀設定面板
══════════════════════════════════════════════ */
const BG_PRESETS = [
  { color:'#FFF9F2', label:'暖米白' },
  { color:'#EBF5FF', label:'天空藍' },
  { color:'#F0FDF4', label:'薄荷綠' },
  { color:'#FFF0F5', label:'淡玫瑰' },
  { color:'#F5F0FF', label:'薰衣草' },
  { color:'#FFFBEB', label:'奶油黃' },
  { color:'#F0FAFA', label:'清水色' },
  { color:'#FFFFFF', label:'純白色' },
];

function openSettings() {
  const s = settings;
  openModal(`<div class="modal" onclick="event.stopPropagation()">
    <div class="modal-title">⚙️ 外觀與使用設定</div>

    <!-- 聲音 -->
    <div class="settings-section">
      <div class="settings-section-title">🔊 聲音</div>
      <div class="toggle-row">
        <div>
          <div class="toggle-label">點擊圖卡自動發音</div>
          <div class="toggle-sub">關閉後需按「說出來」才會朗讀</div>
        </div>
        <label class="toggle-switch">
          <input type="checkbox" id="chkSound" ${s.soundOnClick ? 'checked' : ''} onchange="settings.soundOnClick=this.checked">
          <span class="toggle-track"></span>
        </label>
      </div>
    </div>

    <!-- 字體 -->
    <div class="settings-section">
      <div class="settings-section-title">🔤 圖卡文字大小</div>
      <div class="font-size-btns">
        <button class="fs-btn ${s.fontSize==='normal'?'active':''}" onclick="setFontSize('normal',this)">
          <div style="font-size:13px; font-weight:700;">標準</div>
          <div style="font-size:11px; color:var(--muted);">預設</div>
        </button>
        <button class="fs-btn ${s.fontSize==='large'?'active':''}" onclick="setFontSize('large',this)">
          <div style="font-size:16px; font-weight:700;">大字</div>
          <div style="font-size:11px; color:var(--muted);">+25%</div>
        </button>
        <button class="fs-btn ${s.fontSize==='xlarge'?'active':''}" onclick="setFontSize('xlarge',this)">
          <div style="font-size:19px; font-weight:700;">超大</div>
          <div style="font-size:11px; color:var(--muted);">+60%</div>
        </button>
      </div>
    </div>

    <!-- 背景 -->
    <div class="settings-section">
      <div class="settings-section-title">🎨 背景顏色</div>
      <div class="bg-grid">
        ${BG_PRESETS.map(p => `
          <div class="bg-dot ${s.bgColor===p.color?'active':''}"
               style="background:${p.color}; border:2px solid #E4E0D8;"
               title="${p.label}"
               onclick="setBgColor('${p.color}',this)"></div>`).join('')}
      </div>
      <div style="font-size:11px;color:var(--muted);margin-top:4px;">點擊色塊即時預覽</div>
    </div>

    <div class="modal-actions">
      <button class="m-cancel" onclick="forceClose()">關閉</button>
      <button class="m-save" onclick="applyAndSaveSettings()">套用並儲存</button>
    </div>
  </div>`);
}

function setFontSize(size, el) {
  settings.fontSize = size;
  document.querySelectorAll('.fs-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  applySettings();
}

function setBgColor(color, el) {
  settings.bgColor = color;
  document.querySelectorAll('.bg-dot').forEach(d => d.classList.remove('active'));
  el.classList.add('active');
  applySettings();
}

function applySettings() {
  // 背景色
  document.body.style.background = settings.bgColor;
  document.documentElement.style.setProperty('--bg', settings.bgColor);
  // 字體大小
  const scale = settings.fontSize === 'xlarge' ? 1.6 : settings.fontSize === 'large' ? 1.25 : 1;
  document.documentElement.style.setProperty('--label-size', `clamp(${Math.round(11*scale)}px, ${2*scale}vw, ${Math.round(14*scale)}px)`);
  document.documentElement.style.setProperty('--emoji-size',  `clamp(${Math.round(32*scale)}px, ${7*scale}vw, ${Math.round(46*scale)}px)`);
  document.documentElement.style.setProperty('--visual-size', `clamp(${Math.round(52*scale)}px, ${10*scale}vw, ${Math.round(72*scale)}px)`);
}

function applyAndSaveSettings() {
  applySettings();
  saveState();
  forceClose();
  showToast('✅ 設定已儲存');
}

/* ══════════════════════════════════════════════
   多使用者管理
══════════════════════════════════════════════ */
const USER_COLORS = ['#3B7DD8','#27AE60','#E74C3C','#F59E0B','#8B5CF6','#EC4899','#14B8A6','#6B7280'];

function openUserPanel() {
  const list = users.length
    ? users.map((u, i) => `
        <div class="user-card ${u.id === currentUserId ? 'active-user' : ''}"
             onclick="switchUser('${u.id}')">
          <div class="user-avatar" style="background:${u.color}">${u.name.charAt(0)}</div>
          <div class="user-info">
            <div class="user-name">${esc(u.name)}</div>
            <div class="user-sub">${u.id === currentUserId ? '目前使用中' : '點擊切換'}</div>
          </div>
          ${u.id === currentUserId ? '<span class="user-check">✓</span>' : ''}
          <button onclick="event.stopPropagation();deleteUser('${u.id}')"
                  style="margin-left:4px;background:#FEF2F2;border:none;border-radius:7px;padding:4px 8px;font-size:12px;color:#991B1B;cursor:pointer;">刪除</button>
        </div>`).join('')
    : `<div style="text-align:center;padding:16px;color:var(--muted);font-size:13px;">
         尚未建立任何帳號<br>點下方按鈕新增第一個使用者
       </div>`;

  openModal(`<div class="modal" onclick="event.stopPropagation()">
    <div class="modal-title">👤 切換使用者</div>
    <div style="font-size:12px;color:var(--muted);line-height:1.6;background:var(--blue-lt);border-radius:9px;padding:9px 12px;">
      💡 每個使用者有獨立的圖卡設定。切換後系統會自動載入該使用者的資料。
    </div>
    <div style="display:flex;flex-direction:column;gap:8px;" id="userList">${list}</div>
    <button class="add-user-btn" onclick="openAddUser()">＋ 新增使用者帳號</button>
    <div class="modal-actions">
      <button class="m-cancel" onclick="forceClose()">關閉</button>
    </div>
  </div>`);
}

function openAddUser() {
  forceClose();
  openModal(`<div class="modal" onclick="event.stopPropagation()">
    <div class="modal-title">➕ 新增使用者</div>
    <div class="modal-row">
      <div class="modal-label">姓名</div>
      <input class="modal-input" id="newUserName" placeholder="例如：小明" maxlength="10" aria-label="姓名">
    </div>
    <div class="modal-row">
      <div class="modal-label">頭像顏色</div>
      <div class="color-row" id="userColorRow">
        ${USER_COLORS.map((c,i) => `<div class="color-dot ${i===0?'selected':''}" style="background:${c};"
          onclick="document.querySelectorAll('#userColorRow .color-dot').forEach(d=>d.classList.remove('selected'));this.classList.add('selected');document.getElementById('newUserColor').value='${c}'"></div>`).join('')}
      </div>
      <input type="hidden" id="newUserColor" value="${USER_COLORS[0]}">
    </div>
    <div class="modal-row">
      <div class="modal-label">PIN 碼（選填，4 位數字）</div>
      <input class="modal-input" id="newUserPin" type="password" inputmode="numeric"
             placeholder="不設定留空" maxlength="4" pattern="[0-9]*" aria-label="PIN碼">
    </div>
    <div class="modal-actions">
      <button class="m-cancel" onclick="forceClose();openUserPanel()">取消</button>
      <button class="m-save" onclick="saveNewUser()">建立帳號</button>
    </div>
  </div>`);
  setTimeout(() => document.getElementById('newUserName')?.focus(), 80);
}

function saveNewUser() {
  const name  = document.getElementById('newUserName').value.trim();
  const color = document.getElementById('newUserColor').value;
  const pin   = document.getElementById('newUserPin').value.trim();
  if (!name) { alert('請輸入姓名'); return; }
  if (pin && !/^\d{4}$/.test(pin)) { alert('PIN 碼須為 4 位數字'); return; }
  const id = 'user_' + Date.now();
  // 儲存目前狀態給舊使用者
  if (currentUserId) saveUserData(currentUserId);
  users.push({ id, name, color, pin: pin || '' });
  // 切換到新使用者（全新空白資料）
  currentUserId = id;
  loadUserData(id); // 空的 → 載入預設
  saveState();
  forceClose();
  showToast(`✅ 已建立「${name}」並切換`);
  renderAll(); renderTitle();
}

function switchUser(id) {
  if (id === currentUserId) { forceClose(); return; }
  const u = users.find(u => u.id === id);
  if (!u) return;
  if (u.pin) {
    forceClose();
    openModal(`<div class="modal" onclick="event.stopPropagation()">
      <div class="modal-title">🔑 輸入 PIN 碼</div>
      <div style="font-size:14px;font-weight:700;text-align:center;padding:8px 0;">切換到「${esc(u.name)}」</div>
      <input class="modal-input" id="pinInput" type="password" inputmode="numeric"
             maxlength="4" pattern="[0-9]*" placeholder="請輸入 4 位 PIN 碼"
             style="text-align:center;font-size:24px;letter-spacing:8px;"
             oninput="if(this.value.length===4)doSwitchUser('${id}',this.value)">
      <div class="modal-actions">
        <button class="m-cancel" onclick="forceClose();openUserPanel()">取消</button>
      </div>
    </div>`);
    setTimeout(() => document.getElementById('pinInput')?.focus(), 80);
    return;
  }
  doSwitchUser(id, '');
}

function doSwitchUser(id, pin) {
  const u = users.find(u => u.id === id);
  if (!u) return;
  if (u.pin && u.pin !== pin) { showToast('❌ PIN 碼錯誤', 'err'); return; }
  if (currentUserId) saveUserData(currentUserId);
  currentUserId = id;
  profileName   = u.name;
  loadUserData(id);
  saveState();
  forceClose();
  showToast(`✅ 已切換到「${u.name}」`);
  renderAll(); renderTitle();
}

function saveUserData(userId) {
  try {
    localStorage.setItem(`aac_user_${userId}`, JSON.stringify({ cats, symbols, quickPhrases, appTitle, settings }));
  } catch(e) {}
}

function loadUserData(userId) {
  try {
    const raw = localStorage.getItem(`aac_user_${userId}`);
    if (raw) {
      const d = JSON.parse(raw);
      cats         = d.cats         || cloneDefault('cats');
      symbols      = d.symbols      || cloneDefault('symbols');
      quickPhrases = d.quickPhrases || cloneDefault('quickPhrases');
      appTitle     = d.appTitle     || '🗣️ 我的溝通板';
      settings     = Object.assign({ soundOnClick:true, fontSize:'normal', bgColor:'#FFF9F2' }, d.settings || {});
      currentCat   = cats[0]?.id || 'need';
      applySettings();
      return;
    }
  } catch(e) {}
  // 新使用者 → 預設
  cats         = cloneDefault('cats');
  symbols      = cloneDefault('symbols');
  quickPhrases = cloneDefault('quickPhrases');
  appTitle     = '🗣️ 我的溝通板';
  settings     = { soundOnClick:true, fontSize:'normal', bgColor:'#FFF9F2' };
  currentCat   = 'need';
  applySettings();
}

function deleteUser(id) {
  const u = users.find(u => u.id === id);
  if (!confirm(`確定刪除「${u?.name}」帳號？所有個人資料將一併清除。`)) return;
  localStorage.removeItem(`aac_user_${id}`);
  users = users.filter(u => u.id !== id);
  if (currentUserId === id) {
    currentUserId = users[0]?.id || null;
    if (currentUserId) loadUserData(currentUserId);
    else { cats=cloneDefault('cats'); symbols=cloneDefault('symbols'); quickPhrases=cloneDefault('quickPhrases'); }
  }
  saveState(); forceClose(); openUserPanel();
  showToast('已刪除帳號');
}

/* ══════════════════════════════════════════════
   啟動
══════════════════════════════════════════════ */
loadState();
if (!cats.find(c => c.id === currentCat)) currentCat = cats[0]?.id || 'need';
applySettings();
renderAll();
renderTitle();

document.getElementById('fileInput').addEventListener('change', function() {
  const file = this.files[0];
  if (!file) return;

  const input = this; // 保留 reference，讀完再重設

  if (!file.name.endsWith('.json')) {
    showToast('請選擇 .json 檔案', 'err');
    input.value = '';
    return;
  }

  const reader = new FileReader();

  reader.onerror = function() {
    showToast('❌ 讀取檔案失敗', 'err');
    input.value = '';
  };

  reader.onload = function() {
    input.value = ''; // 讀完才重設

    let d;
    try {
      d = JSON.parse(reader.result);
    } catch(err) {
      showToast('❌ 無法解析 JSON：' + err.message, 'err');
      return;
    }

    if (!Array.isArray(d.cats) || typeof d.symbols !== 'object' || !Array.isArray(d.quickPhrases)) {
      showToast('❌ 備份格式不正確', 'err');
      return;
    }

    const catCount  = d.cats.length;
    const cardCount = Object.values(d.symbols).reduce((a, b) => a + (Array.isArray(b) ? b.length : 0), 0);

    if (!confirm('確定匯入「' + (d.profileName || '未知') + '」的備份？\n' +
                 catCount + ' 個分類・' + cardCount + ' 張圖卡\n\n⚠️ 將覆蓋目前所有設定')) {
      return;
    }

    cats         = d.cats;
    symbols      = d.symbols;
    quickPhrases = d.quickPhrases;
    profileName  = d.profileName || profileName;
    appTitle     = d.appTitle    || appTitle;

    if (d.settings && typeof d.settings === 'object') {
      settings = Object.assign({ soundOnClick: true, fontSize: 'normal', bgColor: '#FFF9F2' }, d.settings);
    }

    if (!cats.find(function(c) { return c.id === currentCat; })) {
      currentCat = cats[0] ? cats[0].id : 'need';
    }

    forceClose();
    saveState();
    applySettings();
    renderAll();
    renderTitle();

    showToast('✅ 已還原！' + catCount + ' 個分類・' + cardCount + ' 張圖卡');
  };

  reader.readAsText(file);
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') forceClose();
  if (e.key === ' ' && e.target === document.body) {
    e.preventDefault();
    speakSentence();
